spring.application.name=DataFlow
spring.datasource.url=jdbc:postgresql://localhost:5432/DataFlow
spring.datasource.username=postgres
spring.datasource.password=pass

spring.jpa.hibernate.ddl-auto=update
# Maximum file size
spring.servlet.multipart.max-file-size=50MB

# Maximum request size
spring.servlet.multipart.max-request-size=55MB

# Tomcat connection timeout
server.tomcat.connection-timeout=120000

# Spring Batch metadata tables
spring.batch.jdbc.initialize-schema=always

# Don't automatically execute batch jobs during application startup
spring.batch.job.enabled=false